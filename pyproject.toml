[tool.ruff]
target-version = "py313"
line-length = 100
extend-include = ["*.ipynb"]
extend-exclude = [
    ".venv",
    "__pycache__",
    "model/artifacts",
    "*/catboost_info",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear (real bug patterns)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "PIE",  # flake8-pie
    "PERF", # perflint
    "ERA",  # eradicate (commented-out code)
    "N",    # pep8-naming
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501", # line length is enforced by the formatter, not the linter
]

# Notebooks are exploratory by nature: relax rules that would otherwise
# fight print-debugging, throwaway variables, and scratch cells.
[tool.ruff.lint.per-file-ignores]
"notebooks/**" = ["ERA001", "F841", "N806", "ARG001"]
"*.ipynb" = ["ERA001", "F841", "N806", "ARG001", "E402"]
# X_train/X_test/y_train/... is the standard scikit-learn naming convention.
"model/train.py" = ["N806"]

[tool.ruff.lint.isort]
known-first-party = ["app", "database", "model", "services"]

[tool.ruff.format]
quote-style = "double"          # "..." everywhere, never '...'
indent-style = "space"          # 4-space indents, never tabs
skip-magic-trailing-comma = false  # a trailing comma keeps a list/call multi-line; omit it to collapse to one line
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
exclude = ["^notebooks/", "^\\.venv/"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = "."
